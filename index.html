<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rent a Car</title>
<style>
:root{
  --bg:#f3f5f9;--card:#fff;--ink:#1b2230;--mute:#7b8494;--line:#e6e9f0;--blue:#1565e8;--blue-soft:#e8f0fe;
  --red:#e5283c;--red-soft:#fdeaec;--orange:#f59e0b;--green:#17a673;--green-soft:#e6f6ef;--gray:#4b5563;--seg:#e8ecf3;
  --shadow:0 1px 3px rgba(20,30,50,.08);
}
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--card:#1c1c1e;--ink:#fff;--mute:#8e8e93;--line:#38383a;--blue:#0a84ff;--blue-soft:#10253d;--red-soft:#3b1519;--green-soft:#10301d;--seg:#2c2c2e;--shadow:none}
:root[data-theme="dark"] .tabs button.on{background:#636366;color:#fff}:root[data-theme="dark"] .hdr,:root[data-theme="dark"] .datebar,:root[data-theme="dark"] .player{background:#1c1c1e}:root[data-theme="dark"] .card{border:0}:root[data-theme="dark"] .tile.b{color:#64b0ff}:root[data-theme="dark"] .tile.r{color:#ff6b78}:root[data-theme="dark"] .tile.g{color:#4cd08c}
:root[data-theme="dark"] .ico.sy{background:#3a3016}:root[data-theme="dark"] .ico.tb{background:#10253d}:root[data-theme="dark"] .ico.tr{background:#3b1519}
.qcard{position:absolute;left:10px;right:10px;bottom:14px;background:var(--card);border-radius:20px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:8;animation:qin .22s}
@keyframes qin{from{opacity:0;transform:translateY(20px)}}
.qtop{display:flex;gap:12px;align-items:center;margin-bottom:12px;padding-right:30px}
.qtop .qph{width:64px;height:48px;border-radius:12px;overflow:hidden;background:#222;flex:none}
.qtop .qph img{width:100%;height:100%;object-fit:cover}
.qtop b{display:block;font-size:14px}.qtop small{display:block;color:var(--mute);font-size:10.5px;margin-top:2px}
.qx{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--mute)}
.qcard .bigbtn{margin:12px 0 0;height:42px}
.sheet{transition:top .25s,transform .25s}.sheet.away{transform:translateY(105%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"SF Pro Text",Roboto,"Segoe UI",sans-serif;font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
#app{position:relative;max-width:430px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 14px;background:var(--card);flex:none}
.hdr h1{font-size:15px;font-weight:600;margin:0;text-align:center;flex:1}
.hdr .ic{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.hdr .ic.ring{color:var(--blue);border:1.5px solid var(--blue);width:26px;height:26px}
.tabs{display:flex;gap:2px;margin:10px 12px;padding:4px;background:var(--seg);border-radius:12px;flex:none}
.tabs button{flex:1;padding:8px 0;border-radius:9px;font-size:12px;color:var(--mute);font-weight:500}
.tabs button.on{background:var(--card);color:var(--blue);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.body{flex:1;overflow:auto;padding:0 12px 14px;-webkit-overflow-scrolling:touch}

/* home */
#mapwrap{position:absolute;inset:0;background:#4a5238}
#mapwrap svg.map{width:100%;height:100%;display:block;touch-action:none}
.mapbtns{position:absolute;right:14px;top:60px;display:flex;flex-direction:column;gap:10px;z-index:3}
.mapbtns.left{right:auto;left:14px;top:auto;bottom:0}
.mb{width:42px;height:42px;border-radius:12px;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.menu-btn{position:absolute;left:14px;top:60px;z-index:3}
.sheet{position:absolute;left:0;right:0;bottom:0;top:46%;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.18);display:flex;flex-direction:column;z-index:4;transition:top .25s}
.sheet.full{top:7%}
.grab{padding:8px 0 4px;display:grid;place-items:center;cursor:pointer}
.grab i{width:38px;height:4px;border-radius:2px;background:var(--line);display:block}
.search{display:flex;align-items:center;gap:10px;margin:2px 16px;padding:8px 0;border-bottom:1px solid var(--line)}
.search input{flex:1;border:0;outline:0;background:none;font-size:13px}
.addbtn{margin:10px 16px 0;height:44px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;box-shadow:0 4px 12px rgba(21,101,232,.35)}
.addbtn:active{transform:scale(.98)}
.lhead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.lhead b{font-size:13px;font-weight:600}
.sortbtn{display:flex;gap:6px;align-items:center;background:var(--blue-soft);color:var(--blue);padding:8px 12px;border-radius:10px;font-weight:600;font-size:12px}
.sortbtn svg{width:15px;height:15px}
.list{flex:1;overflow:auto;padding:0 16px 20px}
.vrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.vrow:last-child{border:0}
.thumb{width:40px;height:30px;border-radius:8px;overflow:hidden;background:#222;flex:none;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.vinfo{flex:1;min-width:0}
.vinfo b{display:block;font-size:12.5px;font-weight:700}
.vinfo small{display:block;font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.badge{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8.5px;color:var(--mute);flex:none}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.dot svg{width:14px;height:14px;fill:#fff;stroke:#fff;stroke-width:1}
.st-parked{background:var(--red)}.st-idle{background:#1ba5e8}.st-moving{background:var(--orange)}.st-offline{background:var(--gray)}
.empty{text-align:center;color:var(--mute);padding:40px 0}

/* cards */
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
.frow{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px}
.fic{width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--mute);flex:none}
.fic svg{width:15px;height:15px}
.frow .l{flex:1}.frow .l b{display:block;font-size:12.5px;font-weight:600}.frow .l small{font-size:9.5px;color:var(--mute)}
.frow .v{font-weight:600;font-size:12.5px}
.photo{height:130px;border-radius:14px;overflow:hidden;margin-bottom:12px;background:linear-gradient(160deg,#8aa5c2,#4a617c);display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover}
.srow{display:flex;align-items:center;gap:8px;padding:6px 4px 10px;font-size:11px;color:var(--mute)}
.srow .p{color:var(--red);font-weight:700;display:flex;align-items:center;gap:6px;margin-right:auto}
.srow .p:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.srow .p.moving{color:var(--orange)}.srow .p.idle{color:#1ba5e8}.srow .p.offline{color:var(--gray)}
.srow span{display:flex;align-items:center;gap:4px}
.srow svg{width:12px;height:12px}
.showmap{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:12px;background:var(--blue-soft);border-radius:12px;width:100%;text-align:left}
.showmap .pin{width:26px;height:26px;border-radius:50%;background:var(--card);color:var(--blue);display:grid;place-items:center;flex:none}
.showmap .pin svg{width:14px;height:14px}
.showmap b{display:block;color:var(--blue);font-size:11px}.showmap small{font-size:9.5px;color:var(--mute);display:block}
.showmap>svg{margin-left:auto;color:var(--mute);width:16px;height:16px}
.sf{display:flex;gap:10px;align-items:center;padding:12px;margin-bottom:14px;color:var(--mute);background:var(--card);border-radius:12px;border:1px solid var(--line)}
.sf input{flex:1;border:0;outline:0;background:none;font-size:12px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}
.sec span{font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.06em}
.sec .sortbtn{padding:6px 10px;font-size:11px}

/* trips */
.stats{display:flex;gap:10px;margin:2px 0 12px}
.stat{flex:1;padding:12px 6px;text-align:center;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.stat svg{width:20px;height:20px;margin:0 auto}
.stat b{display:block;font-size:20px;margin-top:2px;font-weight:700}
.stat small{font-size:8px;letter-spacing:.1em;color:var(--mute)}
.bigbtn{width:100%;height:44px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 4px 12px rgba(21,101,232,.3)}
.bigbtn[disabled]{opacity:.5}
.grp{display:flex;justify-content:space-between;margin:14px 2px 8px;font-size:10px;font-weight:800;letter-spacing:.04em}
.grp em{font-style:normal;font-size:9px;color:var(--blue);background:var(--blue-soft);padding:3px 7px;border-radius:6px;letter-spacing:0}
.tcard{padding:12px;margin-bottom:8px}
.ev{display:flex;gap:12px;align-items:center;padding:8px 0}
.ev .ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.ev .ico svg{width:14px;height:14px}
.ev b{font-size:12.5px;font-weight:600;display:block}.ev small{font-size:9.5px;color:var(--mute)}
.ico.sy{background:#fdf0cf;color:#d98a00;border-radius:8px}.ico.sg{background:var(--bg);color:var(--mute);border-radius:8px}
.ico.tb{background:#e1ecff;color:var(--blue)}.ico.tr{background:#fde1e5;color:var(--red)}
.mini{display:flex;margin:8px 0;padding:10px 0;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.mini div{flex:1;text-align:center;font-size:12px;font-weight:700}.mini svg{width:14px;height:14px;display:block;margin:0 auto 2px}
.mini small{display:block;font-size:8px;color:var(--mute);font-weight:600;letter-spacing:.06em}
.datebar{flex:none;height:52px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:var(--blue)}
.datebar .d{background:var(--bg);padding:9px 20px;border-radius:10px;font-weight:600;font-size:12px;color:var(--ink)}

/* commands */
.cmd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:10px}
.cmd b{font-size:12.5px;font-weight:600}
.send{background:var(--blue);color:#fff;font-weight:800;font-size:10px;padding:9px 16px;border-radius:8px;letter-spacing:.05em}
.hist{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:var(--card);padding:11px 22px;border-radius:12px;display:flex;gap:8px;align-items:center;color:var(--blue);font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.14)}

/* vehicle map */
.pill{display:flex;align-items:center;gap:4px;background:var(--card);padding:8px 14px;border-radius:12px;font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.2);margin-left:10px}
.infocard{position:absolute;left:10px;right:10px;bottom:18px;background:var(--card);border-radius:20px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,.28);z-index:5}
.tiles{display:flex;gap:8px}
.tile{flex:1;border-radius:12px;padding:10px;font-size:9px;font-weight:700;letter-spacing:.05em}
.tile b{display:block;font-size:15px;margin-top:3px;letter-spacing:0;color:var(--ink)}
.tile.r{background:var(--red-soft);color:var(--red)}.tile.b{background:var(--blue-soft);color:var(--blue)}.tile.g{background:var(--green-soft);color:var(--green)}
.addr{display:flex;gap:10px;align-items:center;margin-top:8px;background:var(--bg);padding:10px;border-radius:12px;font-size:10px;color:var(--mute)}
.addr .pin{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.addr .pin svg{width:15px;height:15px}

/* route player */
.player{flex:none;background:var(--card);padding:6px 18px 14px;position:relative}
.player .times{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--mute)}
.player .now{background:var(--blue);color:#fff;font-weight:700;padding:5px 10px;border-radius:8px;font-size:11px}
input[type=range]{width:100%;accent-color:var(--blue);margin:8px 0}
.ctrl{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.ctrl button.s{display:grid;place-items:center;gap:0;font-size:8px;color:var(--mute)}
.ctrl button.s svg{width:18px;height:18px}
.play{width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(21,101,232,.4)}
.play svg{fill:#fff;width:22px;height:22px}
.speeds{display:flex;gap:10px;justify-content:center;margin-top:12px}
.speeds button{padding:7px 16px;border-radius:14px;background:var(--seg);font-size:11px;font-weight:700;color:var(--mute)}
.speeds button.on{background:var(--blue);color:#fff}
.spd{position:absolute;left:12px;top:-52px;width:46px;height:46px;border-radius:50%;background:var(--card);border:3px solid var(--green);display:grid;place-items:center;text-align:center;font-weight:800;line-height:1;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.spd small{display:block;font-size:7px;color:var(--mute);font-weight:500}

/* form */
.form{padding:14px 14px 100px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.06em;margin-bottom:6px}
.fld input,.fld select{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;outline:0;font-size:14px}
.fld input:focus,.fld select:focus{border-color:var(--blue)}
.two{display:flex;gap:10px}.two .fld{flex:1}
.upl{height:150px;border-radius:14px;border:2px dashed var(--line);background:var(--card);display:grid;place-items:center;color:var(--mute);overflow:hidden;width:100%;margin-bottom:14px;text-align:center}
.upl img{width:100%;height:150px;object-fit:cover}
.upl span{display:grid;gap:6px;justify-items:center;font-weight:600}
.foot{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.foot .bigbtn{margin:0}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#1b2230;color:#fff;padding:10px 16px;border-radius:12px;font-size:12px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.3);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.pop{position:absolute;right:12px;top:54px;background:var(--card);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:20;overflow:hidden;min-width:170px}
.pop button{display:flex;gap:10px;padding:13px 16px;width:100%;align-items:center;font-weight:600;font-size:13px}
.pop button.del{color:var(--red)}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end}
.msheet{width:100%;background:var(--card);border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.mh{display:flex;justify-content:space-between;padding:14px 18px;color:var(--mute);font-size:13px}.mh b{color:var(--ink);font-weight:600}.mh .done{color:var(--blue);font-weight:600}
.msheet .in{padding:10px 18px 14px}.msheet input[type=date]{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px}
.drawer{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.4)}
.drawer>div{width:78%;height:100%;background:var(--card);padding:60px 16px 16px}
.drawer h2{margin:0 0 16px;font-size:20px}
.drawer button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 8px;border-radius:10px;font-weight:600}
.drawer button:active{background:var(--bg)}
</style>
</head>

  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;
let cloudSaveTimer = null;
let cloudLoaded = false;
function queueCloudSave(){
  if(!supabaseClient || !cloudLoaded) return;
  clearTimeout(cloudSaveTimer);

    const {error}=await supabaseClient.from('rentacar_state').upsert({
      id:1, cars, history:hist, updated_at:new Date().toISOString()

async function loadCloudState(){
  if(!supabaseClient) return;
  try{
    const {data,error}=await supabaseClient.from('rentacar_state')
      .select('cars,history').eq('id',1).maybeSingle();
    if(error) throw error;
    if(data){
      if(Array.isArray(data.cars) && data.cars.length) cars=data.cars;
      if(data.history && typeof data.history==='object') hist=data.history;
      try{localStorage.setItem(KEY,JSON.stringify(cars));localStorage.setItem(HKEY,JSON.stringify(hist))}catch(e){}
      render();
    }else{
      await supabaseClient.from('rentacar_state').upsert({id:1,cars,history:hist,updated_at:new Date().toISOString()});

    console.error('Supabase load failed:',e.message);

  }
}

const MP=(lat,lng,z)=>{const s=256*Math.pow(2,z);return[s*(lng+180)/360,s*(.5-Math.log(Math.tan(Math.PI/4+lat*Math.PI/360))/(2*Math.PI))]};

 b.innerHTML=`<div class="body"><div class="photo" data-a="chphoto" style="position:relative;cursor:pointer">${pic(c)?`<img src="${pic(c)}" alt="">`:`<div style="width:130px">${carSvg(c.color)}</div>`}<span style="position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:5px 9px;font-size:10px;display:flex;gap:4px;align-items:center">${ic('cam')}Change photo</span></div><input type="file" id="cfile" accept="image/*" hidden>
 <div class="srow"><b class="p ${c.status}">${c.status[0].toUpperCase()+c.status.slice(1)}</b><span>${ic('road')} ${c.odo%1000+0.2} km</span><span>${ic('clock')} ${clock(c.mins)}</span></div>
 <button class="showmap" data-a="vmap"><span class="pin">${ic('pin')}</span><span><b>Show on Map</b><small>${esc(c.address)}</small></span>${ic('back','')}</button>
 <label class="sf">${ic('sort')}<input id="fq" placeholder="Search fields..." value="${esc(S.fieldQ)}"></label>
 <div class="sec"><span>MAPPED FIELDS</span><button class="sortbtn" data-a="toast" data-t="Sorted">${ic('sort')} Sort</button></div>
 <div id="flist">${fl(f,c)}</div></div>`;
 $('#cfile').addEventListener('change',e=>{const f=e.target.files[0];if(f)resizePhoto(f,d=>{c.photo=d;save();render();toast('Photo updated')})});
 $('#fq').addEventListener('input',e=>{S.fieldQ=e.target.value;$('#flist').innerHTML=fl(fields(c).filter(x=>x[0].toLowerCase().includes(S.fieldQ.toLowerCase())),c)});
}
const fl=(f,c)=>f.map(x=>`<div class="card frow"><span class="fic">${ic(x[1])}</span><span class="l"><b>${x[0]}</b><small>${clock(c.mins)}:34</small></span><span class="v">${x[2]}</span></div>`).join('');
// show_back chevron should point right
P.back='<path d="M9 18l6-6-6-6"/>';
function tEvents(c,b){
 const r=rng(hash(c.id+'ev'));const E=[['Ignition off','key','tr'],['Door locked','lock','tb'],['Door unlocked','door','tb'],['Geofence exit','flag','sy'],['Speeding 78 km/h','warn','sy'],['Ignition on','key','tb'],['Customer pickup','tag','tb']];
 let t=21*60+40;const rows=[];for(let i=0;i<9;i++){const e=E[(r()*E.length)|0];rows.push(`<div class="card frow"><span class="fic" style="background:none"><span class="ico ${e[2]}" style="width:32px;height:32px;display:grid;place-items:center;border-radius:50%">${ic(e[1])}</span></span><span class="l"><b>${e[0]}</b><small>${esc(c.address)}</small></span><span class="v" style="font-size:11px;color:var(--mute)">${pad(Math.floor(t/60))}:${pad(t%60)}</span></div>`);t-=20+Math.floor(r()*80)}
 b.innerHTML=`<div class="body">${rows.join('')}</div>`;
}
/* trips */
const dstr=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const isToday=d=>d.toDateString()===new Date().toDateString();
function genTrips(c,d){
 const r=rng(hash(c.id+d.toDateString()));const n=2+Math.floor(r()*3);let t=8*60;const items=[];let km=0,dur=0;
 for(let i=1;i<=n;i++){const sdur=20+Math.floor(r()*140);items.push({k:'st',a:t,b:t+sdur});t+=sdur;const len=8+Math.floor(r()*55),dist=+(2+r()*9).toFixed(1);
  items.push({k:'tr',n:i,a:t,b:t+len,avg:10+Math.floor(r()*30),max:40+Math.floor(r()*50),dist,from:ADDR[(r()*ADDR.length)|0],to:ADDR[(r()*ADDR.length)|0]});km+=dist;dur+=len;t+=len}
 items.push({k:'st',a:t,b:t+90});return{items,km:+km.toFixed(1),dur,n}
}
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const dd=m=>`${Math.floor(m/60)} H ${m%60} MIN ${pad(Math.floor(Math.random()*0)+((m*7)%60))} SEC`;
function tTrips(c,b){
 const T=genTrips(c,S.date);
 b.innerHTML=`<div class="body"><div class="stats"><div class="stat"><span style="color:var(--blue)">${ic('route')}</span><b>${T.n}</b><small>TRIPS</small></div><div class="stat"><span style="color:var(--green)">${ic('road')}</span><b>${T.km} km</b><small>DISTANCE</small></div><div class="stat"><span style="color:var(--orange)">${ic('clock')}</span><b>${Math.floor(T.dur/60)?Math.floor(T.dur/60)+'h ':''}${T.dur%60}m</b><small>DURATION</small></div></div>
 <button class="bigbtn" data-a="route">View Route ${ic('route')}</button>
 ${T.items.map(x=>x.k==='st'?`<div class="grp"><span>STANDSTILL</span><em>${dd(x.b-x.a)}</em></div><div class="card tcard"><div class="ev"><span class="ico sy">${ic('tag')}</span><b>${hm(x.a)} Standstill started</b></div><div class="ev"><span class="ico sg">${ic('clock')}</span><b>${hm(x.b)} Standstill ended</b></div></div>`:
 `<div class="grp"><span>TRIP ${x.n}</span><em>${dd(x.b-x.a)}</em></div><div class="card tcard"><div class="ev"><span class="ico tb">${ic('play')}</span><span style="flex:1"><b>${hm(x.a)} Trip started</b><small>${esc(x.from)}</small></span>${ic('back')}</div>
 <div class="mini"><div><span style="color:var(--blue)">${ic('gauge')}</span>${x.avg} km/h<small>AVG</small></div><div><span style="color:var(--red)">${ic('gauge')}</span>${x.max} km/h<small>MAX</small></div><div><span style="color:var(--green)">${ic('road')}</span>${x.dist} km<small>DISTANCE</small></div></div>
 <div class="ev"><span class="ico tr">${ic('stop')}</span><span><b>${hm(x.b)} Trip ended</b><small>${esc(x.to)}</small></span></div></div>`).join('')}</div>
 <div class="datebar"><button data-a="dprev">${ic('back').replace('M9 18l6-6-6-6','M15 18l-6-6 6-6')}</button><button class="d" data-a="datepick">${isToday(S.date)?'Today, ':''}${dstr(S.date)}</button><button data-a="dnext" style="opacity:${isToday(S.date)?.35:1}">${ic('back')}</button></div>`;
}
function tCommands(c,b){
 const h=hist[c.id]||[];
 b.innerHTML=`<div class="body">${['Fike-Veturen','Ndize-Veturen'].map(n=>`<div class="card cmd"><b>${n}</b><button class="send" data-a="send" data-n="${n}">SEND</button></div>`).join('')}</div><button class="hist" data-a="history">${ic('hist')} History</button>`;
}
function rHistory(){
 const c=byId(S.id),h=hist[c.id]||[];
 app.innerHTML=`<div class="screen"><div class="hdr"><button class="ic" data-a="backdetail">${ic('arrow')}</button><h1>Command History</h1><span style="width:36px"></span></div><div class="body" style="padding-top:12px">${h.length?h.map(x=>`<div class="card frow"><span class="fic">${ic('hist')}</span><span class="l"><b>${esc(x.n)}</b><small>${esc(x.t)}</small></span><span class="v" style="color:var(--green);font-size:11px">Sent</span></div>`).join(''):`<div class="empty" style="margin-top:30vh"><div style="width:40px;height:40px;border-radius:50%;background:var(--seg);display:grid;place-items:center;margin:0 auto 10px">${ic('clock')}</div>No command history yet</div>`}</div></div>`;
}

/* ---------- vehicle map ---------- */
function rVMap(){
 const c=byId(S.id);
 app.innerHTML=`<div class="screen"><div class="hdr" style="background:var(--card)"><button class="pill" data-a="backdetail" style="margin:0">${ic('back').replace('M9 18l6-6-6-6','M15 18l-6-6 6-6')} Back</button><h1 style="text-align:left;margin-left:14px;font-weight:500">${esc(c.name)}</h1></div>
 <div style="flex:1;position:relative"><div id="mapwrap" style="position:absolute;inset:0"></div><div class="mapbtns" style="top:14px"><button class="mb">${ic('layers')}</button><button class="mb" data-a="fitv">${ic('locate')}</button></div>
 <div class="infocard"><div class="tiles"><div class="tile r">● STATUS<b>${c.status[0].toUpperCase()+c.status.slice(1)}</b></div><div class="tile b">SPEED<b>${c.speed} <small style="font-size:10px;font-weight:400">km/h</small></b></div><div class="tile g">LAST SEEN<b>${clock(c.mins)}</b></div></div>
 <div class="addr"><span class="pin">${ic('pin')}</span>${esc(c.address)}</div></div></div></div>`;
 const m=makeMap($('#mapwrap'),{cx:c.x,cy:c.y-30,k:2.2});m.setMarkers([c],c.id);S._vm=m;
}

/* ---------- route playback ---------- */
function routePts(c){const r=rng(hash(c.id+S.date.toDateString()+'r'));let x=c.x-150,y=c.y+120;const p=[];let a=-.6;for(let i=0;i<70;i++){a+=(r()-.5)*.9;x+=Math.cos(a)*10;y+=Math.sin(a)*10;p.push([x,y])}return p}
function rRoute(){
 const c=byId(S.id);const pts=routePts(c);const total=(11*60+29);
 app.innerHTML=`<div class="screen"><div class="hdr" style="height:56px;gap:10px"><button class="ic" data-a="backdetail">${ic('arrow')}</button><span style="color:var(--blue)">${ic('pin')}</span><span style="flex:1;font-size:11px;line-height:1.3">${esc(c.address)}</span></div>
 <div style="flex:1;position:relative"><div id="mapwrap" style="position:absolute;inset:0"></div><div class="mapbtns" style="top:14px"><button class="mb">${ic('layers')}</button><button class="mb" data-a="rfollow">${ic('locate')}</button><button class="mb" data-a="rz" data-z="1.3">${ic('plus')}</button><button class="mb" data-a="rz" data-z=".77">${ic('minus')}</button></div></div>
 <div class="player"><div class="spd" id="spd"><span>0<small>km/h</small></span></div><div class="times"><span class="now" id="now">08:00</span><span>19:29</span></div>
 <input type="range" id="rng" min="0" max="1000" value="0"><div class="ctrl"><button class="s" data-a="skip" data-m="-5">${ic('rew')}5m</button><button class="s" data-a="skip" data-m="-1">${ic('rew')}1m</button><button class="play" id="pp" data-a="pp">${ic('play')}</button><button class="s" data-a="skip" data-m="1">${ic('ff')}1m</button><button class="s" data-a="skip" data-m="5">${ic('ff')}5m</button></div>
 <div class="speeds">${[1,2,5,10].map(x=>`<button data-a="mult" data-x="${x}" class="${x===1?'on':''}">x${x}</button>`).join('')}</div></div></div>`;
 const m=makeMap($('#mapwrap'),{cx:pts[0][0]+60,cy:pts[0][1]-30,k:3});
 m.setRoute(pts);m.setCar(pts[0]);
 player={t:0,mult:1,play:false,pts,m,total,timer:null,follow:true};
 const upd=()=>{const p=player,f=p.t*(pts.length-1),i=Math.min(Math.floor(f),pts.length-2),q=f-i;const x=pts[i][0]+(pts[i+1][0]-pts[i][0])*q,y=pts[i][1]+(pts[i+1][1]-pts[i][1])*q;
  m.setCar([x,y]);if(p.follow&&p.play)m.center(x,y);
  const mins=Math.round(p.t*total)+480;$('#now').textContent=hm(mins);$('#rng').value=Math.round(p.t*1000);
  $('#spd').innerHTML=`<span>${p.play?Math.round(18+14*Math.sin(p.t*40)):0}<small>km/h</small></span>`};
 player.upd=upd;upd();
 $('#rng').addEventListener('input',e=>{player.t=e.target.value/1000;upd()});
}
function stopPlayer(){if(player&&player.timer)clearInterval(player.timer);player=null}
function togglePlay(){const p=player;if(!p)return;p.play=!p.play;$('#pp').innerHTML=ic(p.play?'pause':'play');
 if(p.play){if(p.t>=1)p.t=0;p.m.center(...p.pts[0],3);p.timer=setInterval(()=>{p.t=Math.min(1,p.t+.0015*p.mult);p.upd();if(p.t>=1){p.play=false;clearInterval(p.timer);$('#pp').innerHTML=ic('play')}},60)}else clearInterval(p.timer)}

/* ---------- ADD A CAR ---------- */
let draft={};
function rAdd(){
 const d=draft;
 app.innerHTML=`<div class="screen"><div class="hdr"><button class="ic" data-a="home">${ic('arrow')}</button><h1>Add a car</h1><span style="width:36px"></span></div>
 <div class="body form"><button class="upl" data-a="pick">${d.photo?`<img src="${d.photo}" alt="">`:`<span>${ic('cam')}Add photo</span>`}</button><input type="file" id="file" accept="image/*" hidden>
 <div class="fld"><label>MAKE & MODEL</label><input id="f_make" placeholder="e.g. Golf 7" value="${esc(d.make||'')}"></div>
 <div class="fld"><label>LICENSE PLATE</label><input id="f_plate" placeholder="e.g. 01 160 UK" value="${esc(d.plate||'')}"></div>
 <div class="two"><div class="fld"><label>PRICE PER DAY (€)</label><input id="f_rate" type="number" inputmode="numeric" placeholder="35" value="${esc(d.rate||'')}"></div><div class="fld"><label>MILEAGE (KM)</label><input id="f_odo" type="number" inputmode="numeric" placeholder="120000" value="${esc(d.odo||'')}"></div></div>
 <div class="two"><div class="fld"><label>FUEL LEVEL (%)</label><input id="f_fuel" type="number" inputmode="numeric" placeholder="80" value="${esc(d.fuel||'')}"></div><div class="fld"><label>COLOR</label><input id="f_color" type="color" value="${d.color||'#2f5d9c'}" style="padding:4px"></div></div>
 <div class="fld"><label>ADDRESS / LOCATION</label><input id="f_addr" placeholder="Street, city" value="${esc(d.addr||'')}"></div>
 <div class="two"><div class="fld"><label>STATUS</label><select id="f_st">${['parked','idle','moving','offline'].map(s=>`<option value="${s}" ${d.st===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></div><div class="fld"><label>RENTAL</label><select id="f_rent">${['Available','Rented'].map(s=>`<option ${d.rent===s?'selected':''}>${s}</option>`).join('')}</select></div></div></div>
 <div class="foot"><button class="bigbtn" data-a="savecar">Save car</button></div></div>`;
 $('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;readForm();const img=new Image,u=URL.createObjectURL(f);img.onload=()=>{const k=Math.min(1,720/img.width),cv=document.createElement('canvas');cv.width=img.width*k;cv.height=img.height*k;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);draft.photo=cv.toDataURL('image/jpeg',.78);URL.revokeObjectURL(u);rAdd()};img.src=u});
}
function readForm(){const g=i=>$('#'+i)?.value;Object.assign(draft,{make:g('f_make'),plate:g('f_plate'),rate:g('f_rate'),odo:g('f_odo'),fuel:g('f_fuel'),color:g('f_color'),addr:g('f_addr'),st:g('f_st'),rent:g('f_rent')})}
function saveCar(){
 readForm();const d=draft;if(!d.make?.trim()){toast('Enter make & model');return}
 const r=Math.random;cars.unshift({id:'c'+Date.now(),name:d.plate?.trim()?`${d.make.trim()} - ${d.plate.trim()}`:d.make.trim(),address:d.addr?.trim()||ADDR[0],status:d.st||'parked',mins:0,color:d.color||'#2f5d9c',speed:d.st==='moving'?20:0,
  fuelPct:Math.min(100,+d.fuel||70),tank:50,odo:+d.odo||0,rate:+d.rate||30,rental:d.rent||'Available',x:300+r()*600,y:400+r()*1000,photo:d.photo||''});
 save();draft={};S.q='';go('home');toast('Car added')
}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t){if(S.pop){S.pop=false;render()}return}
 const a=t.dataset.a,c=byId(S.id);
 switch(a){
  case 'theme':toggleTheme();break;
  case 'qclose':closeQuick();break;
  case 'toast':toast(t.dataset.t);break;
  case 'home':S.pop=false;go('home');break;
  case 'add':draft={};go('add');break;
  case 'open':go('detail',{id:t.dataset.id,tab:'status',pop:false,fieldQ:''});break;
  case 'grab':S.full=!S.full;$('.sheet').classList.toggle('full',S.full);break;
  case 'sort':S.sortBy={name:'seen',seen:'status',status:'name'}[S.sortBy];toast('Sorted by '+({name:'name',seen:'last seen',status:'status'}[S.sortBy]));drawHome();break;
  case 'fit':fitMap();break;
  case 'drawer':{const d=document.createElement('div');d.className='drawer';d.innerHTML=`<div><h2>Rent a Car</h2><button data-a="dclose-add">${ic('plus')} Add a car</button><button data-a="dclose">${ic('car')} All vehicles</button><button data-a="dclose-theme">${ic(THEME==='dark'?'sun':'moon')} ${THEME==='dark'?'Light mode':'Dark mode'}</button></div>`;d.addEventListener('click',ev=>{const b=ev.target.closest('button');if(b&&b.dataset.a==='dclose-add'){draft={};d.remove();go('add')}else if(b&&b.dataset.a==='dclose-theme'){d.remove();toggleTheme()}else d.remove();ev.stopPropagation()});app.appendChild(d);break}
  case 'tab':S.tab=t.dataset.t;S.pop=false;render();break;
  case 'pop':S.pop=!S.pop;render();e.stopPropagation();break;
  case 'del':if(confirm('Delete this car?')){cars=cars.filter(x=>x.id!==S.id);delete hist[S.id];save();S.pop=false;go('home')}break;
  case 'vmap':go('vmap');break;
  case 'fitv':S._vm.center(c.x,c.y-30,2.2);break;
  case 'backdetail':go('detail');break;
  case 'route':go('route');break;
  case 'rz':player.m.zoom(+t.dataset.z);break;
  case 'rfollow':player.follow=true;break;
  case 'pp':togglePlay();break;
  case 'mult':player.mult=+t.dataset.x;document.querySelectorAll('.speeds button').forEach(b=>b.classList.toggle('on',b===t));break;
  case 'skip':player.t=Math.max(0,Math.min(1,player.t+(+t.dataset.m)/player.total));player.upd();break;
  case 'send':{const n=t.dataset.n;(hist[S.id]=hist[S.id]||[]).unshift({n,t:new Date().toLocaleString()});save();toast(n+' sent');break}
  case 'history':go('history');break;
  case 'dprev':S.date=new Date(S.date.getTime()-864e5);render();break;
  case 'dnext':if(!isToday(S.date)){S.date=new Date(S.date.getTime()+864e5);render()}break;
  case 'datepick':{const m=document.createElement('div');m.className='modal';const v=S.date.getFullYear()+'-'+pad(S.date.getMonth()+1)+'-'+pad(S.date.getDate());
   m.innerHTML=`<div class="msheet"><div class="mh"><button data-x="c">Cancel</button><b>Select Date</b><button class="done" data-x="d">Done</button></div><div class="in"><input type="date" id="dp" value="${v}" max="${v.slice(0,0)}${new Date().toISOString().slice(0,10)}"></div></div>`;
   m.addEventListener('click',ev=>{const x=ev.target.dataset.x;if(x==='d'){const val=$('#dp').value;if(val){S.date=new Date(val+'T12:00:00');m.remove();render()}}else if(x==='c'||ev.target===m)m.remove()});app.appendChild(m);break}
  case 'chphoto':$('#cfile').click();break;
  case 'pick':readForm();$('#file').click();break;
  case 'savecar':saveCar();break;
 }
});
render();
loadCloudState();
</script>
